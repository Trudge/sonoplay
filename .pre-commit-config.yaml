# Local guardrail: run `pre-commit install` once per clone.
# The full weekly scan (including Docker images) is handled by CI + the
# media-security-scan systemd timer.
minimum_pre_commit_version: "3.0.0"
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-q", "-lll"]
        exclude: ^(\.venv|node_modules|build|dist|tests|.*/tests|.*/tests_tv)/

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint
        args: ["--failure-threshold", "error"]

  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit (requirements / uv.lock / pyproject)
        entry: bash scripts/security-audit.sh
        language: system
        pass_filenames: false
        files: ^(requirements.*\.txt|pyproject\.toml|uv\.lock)$
